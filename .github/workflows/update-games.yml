name: Update games listing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1-31/2 * *"

permissions:
  contents: write

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Fetch games listing
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: python scripts/update_games.py

      - name: Commit changes
        run: |
          if git diff --quiet -- src/plugin/games.json; then
            echo "Games listing is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update games listing" src/plugin/games.json
          git push
